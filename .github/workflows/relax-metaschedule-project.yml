name: Relax MetaSchedule subproject CI
on:
  push:
    paths:
      - 'projects/lenet5-relax-metaschedule/**'
      - '.github/workflows/relax-metaschedule-project.yml'
  pull_request:
    paths:
      - 'projects/lenet5-relax-metaschedule/**'
      - '.github/workflows/relax-metaschedule-project.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/lenet5-relax-metaschedule
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test model, report semantics, export, and notebook
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src

  tvm-cpu-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/lenet5-relax-metaschedule
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and pinned modern TVM wheel
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'apache-tvm[torch,meta-schedule]==0.27.0.post1'
      - name: Validate real PyTorch export into Relax and TensorIR
        env:
          RUN_TVM_CPU_INTEGRATION: '1'
        run: python -m pytest -q tests/test_tvm_integration.py
