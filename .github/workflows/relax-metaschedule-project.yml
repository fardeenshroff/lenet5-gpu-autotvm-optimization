name: Relax MetaSchedule subproject CI
on:
  push:
    paths:
      - 'projects/lenet5-relax-metaschedule/**'
      - '.github/workflows/relax-metaschedule-project.yml'
  pull_request:
    paths:
      - 'projects/lenet5-relax-metaschedule/**'
      - '.github/workflows/relax-metaschedule-project.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/lenet5-relax-metaschedule
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test PyTorch model and experiment code
        run: python -m pytest -q
      - name: Compile sources
        run: python -m compileall -q src
  tvm-cpu-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/lenet5-relax-metaschedule
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned TVM 0.27 with bundled tvm.tirx
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'apache-tvm[torch,meta-schedule]==0.27.0.post1'
      - name: Confirm bundled TVM TensorIR interface and run Relax integration
        env:
          RUN_TVM_CPU_INTEGRATION: '1'
        run: |
          python -c 'import tvm,tvm.tirx; print(tvm.__version__)'
          python -m pytest -q tests/test_tvm_integration.py
