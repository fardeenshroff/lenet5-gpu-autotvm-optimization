[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-lenet-autotvm"
version = "0.1.0"
description = "LeNet-5 GPU inference benchmarking and legacy TVM/AutoTVM reproduction"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "torchvision>=0.15", "numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
